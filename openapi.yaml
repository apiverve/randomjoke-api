openapi: 3.0.4
info:
  title: Random Joke
  description: >-
    Random Joke fetches two-part jokes with separated setups and punchlines for
    applications and bots. Paid plans add a joke rating score to evaluate humor.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/randomjoke:
    get:
      summary: Random Joke
      description: Get a random joke from a collection of jokes
      operationId: randomjoke
      parameters:
        - name: safe
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Only return jokes reviewed as safe for a general audience (no
            sexual, offensive, violent or political jokes). Set to false to
            include the full collection, which has adult humor
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  score: 9
                  setup: Why did the stonemason break up with the female con artist?
                  punchline: She took him for granite.
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
